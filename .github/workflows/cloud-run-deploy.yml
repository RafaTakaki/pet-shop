name: Build and Deploy to Cloud Run

on:
  push:
    branches: [ main ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true

      - name: Build (Cloud Build) and push image
        run: |
          gcloud builds submit --tag gcr.io/${{ secrets.GCP_PROJECT }}/pet-shop .

      - name: Deploy to Cloud Run
        env:
          REGION: ${{ secrets.GCP_REGION || 'europe-west1' }}
        run: |
          gcloud run deploy pet-shop \
            --image gcr.io/${{ secrets.GCP_PROJECT }}/pet-shop \
            --platform managed \
            --region "$REGION" \
            --allow-unauthenticated \
            --port 8080

      - name: Smoke tests
        env:
          REGION: ${{ secrets.GCP_REGION || 'europe-west1' }}
        run: |
          URL=$(gcloud run services describe pet-shop --platform managed --region "$REGION" --format='value(status.url)')
          echo "Deployed URL: $URL"
          echo "Testing /api/Pet/listarRacaGatos"
          curl -i "$URL/api/Pet/listarRacaGatos" -H "accept: text/plain" || true
